name: parastell_openmc016
channels:
  - conda-forge
dependencies:
  - python>=3.12
  - cadquery
  - gmsh
  - moab>=5.5[build=nompi_tempest_*]
  - dagmc>=3.2[build=nompi_*]
  - cad_to_dagmc>=0.9.1
  - h5py
  - matplotlib
  - numpy
  - scipy
  - setuptools<82
  - pip
  - pip:
    - netcdf4
    - pyyaml
    - pydagmc
    - pytest
    - build
    - black==25.*
# OpenMC must be built from the official v0.16.0 tag with DAGMC and OpenMP.
# The repository validation audit records its exact Git SHA and build options.
