[project]
name = "parastell"
description = "Parametric 3-D CAD modeling toolset for stellarator fusion devices"
version = "0.1.0"

readme = "README.md"
requires-python = ">=3.11.0"
maintainers = [
    {name = "Connor Moreno", email = "camoreno@wisc.edu"},
    {name = "Paul Wilson", email = "paul.wilson@wisc.edu"}
]

authors = [
    {name = "Connor Moreno"},
    {name = "Edgar Pflug"},
    {name = "Paul Wilson"},
    {name = "Eitan Weinstein"},
    {name = "Enrique Miralles-Dolz"},
    {name = "Joshua Smandych"},
    {name = "Paul Romano"},
    {name = "Bowen Quan"},
    {name = "Jonathan Shimwell"}
]

keywords = ["stellarator", "fusion", "reactor", "parametric", "cad", "model", "dagmc", "geometry"]
license = {file="LICENSE.md"}
classifiers = [
       "Development Status :: 3 - Alpha",
       "Intended Audience :: Science/Research",
       "Intended Audience :: Developers",
       "License :: OSI Approved :: MIT License",
       "Natural Language :: English",
       "Operating System :: OS Independent",
       "Topic :: Scientific/Engineering :: Physics",
       "Topic :: Scientific/Engineering",
       "Topic :: Scientific/Engineering :: Human Machine Interfaces",
       "Programming Language :: Python :: 3 :: Only",
       "Programming Language :: Python :: 3.11",
]

dependencies = [
    "cadquery",
    "gmsh",
    "pymoab>=5.5",
    "cad_to_dagmc>=0.9.1",
    "openmc>=0.15.1",
    "h5py",
    "matplotlib",
    "numpy",
    "requests",
    "scipy",
    "netcdf4",
    "pyyaml",
    "pydagmc"
]

[project.optional-dependencies]
test = ["pytest", "pytest-cov"]

openmc016 = ["openmc>=0.16.0"]

format = ["black==25.*"]

build = ["build"]

develop = ["parastell[test,format,build]"]

[project.urls]
Repository = "https://github.com/svalinn/parastell.git"
"Bug Tracker" = "https://github.com/svalinn/parastell/issues"

[project.scripts]
"parastell" = "parastell.cli:main"
"parastell-magnet-handoff" = "parastell.magnet_handoff_cli:main"
"parastell-magnet-handoff-validate" = "parastell.magnet_handoff_validation:main"
"parastell-openmc16-handoff" = "parastell.openmc16_cli:main"
"parastell-comsol-fusion-magnets" = "parastell.comsol_fusion_magnets:main"

[build-system]
requires = ["setuptools>=64.0.0"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 79
target-version = ['py311', 'py312', 'py313']

[tool.setuptools.package-data]
"parastell.energy_groups" = ["data/*.json"]

[tool.setuptools.packages.find]
where = ["."]
include = ["parastell", "parastell.*"]
exclude = [
    "build",
    "build.*",
    "dist",
    "dist.*",
    "*.egg-info",
    "tests",
    "tests.*",
    "validation_output",
    "validation_output.*",
]
namespaces = false

[tool.setuptools.data-files]
"share/parastell/schemas" = ["schemas/magnet_spectral_handoff.schema.json"]
"share/parastell/examples" = ["examples/magnet_spectral_handoff.yaml"]
