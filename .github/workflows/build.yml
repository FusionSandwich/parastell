name: Test packaging and installing

on:
  workflow_dispatch:
  push:
    branches:
      - reactor-magnet-spectral-handoff-20260811
  pull_request:
    paths-ignore:
      - 'Dockerfile'
      - '.github/workflows/docker_publish.yml'

defaults:
  run:
    shell: bash -l {0}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }} and conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: ${{ matrix.python-version }}
          activate-environment: parastell_env
          environment-file: environment.yml

      - name: Verify MOAB Python bindings
        run: |
          python -c "import pkg_resources; from pymoab import core; core.Core()"

      - name: Install with pip
        run: pip install --no-deps .

      - name: Test building distributions
        run: python -m build --sdist --wheel

      - name: Test command-line utility
        run: parastell -h

      - name: Test executable module
        run: python -m parastell -h

      - name: Test Python import
        run: python -c "import parastell"
