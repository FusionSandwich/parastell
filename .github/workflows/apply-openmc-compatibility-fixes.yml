name: Apply OpenMC compatibility fixes

on:
  push:
    branches:
      - agent/reactor-magnet-spectral-handoff-20260811

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Trigger OpenMC compatibility fixes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch, format, and commit source files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          test_path = Path("tests/test_magnet_spectral_handoff.py")
          test_text = test_path.read_text(encoding="utf-8")
          old_test = '''def test_openmc_015_unstructured_mesh_dataframe_compatibility():
              mesh = openmc.UnstructuredMesh("coil_mesh.h5m", "moab", mesh_id=811)
              mesh.dimension = (3,)
              mesh_filter = openmc.MeshFilter(mesh)
          '''
          new_test = '''def test_openmc_015_unstructured_mesh_dataframe_compatibility(monkeypatch):
              monkeypatch.setattr(
                  openmc.UnstructuredMesh,
                  "dimension",
                  property(lambda self: (3,)),
              )
              mesh = openmc.UnstructuredMesh("coil_mesh.h5m", "moab", mesh_id=811)
              mesh_filter = openmc.MeshFilter(mesh)
          '''
          if test_text.count(old_test) != 1:
              raise SystemExit("unstructured-mesh test patch anchor mismatch")
          test_path.write_text(test_text.replace(old_test, new_test), encoding="utf-8")

          validation_path = Path("parastell/magnet_handoff_validation.py")
          validation_text = validation_path.read_text(encoding="utf-8")
          old_validation = '''    output_dir = _fresh_directory(output_dir)
              planar = run_planar_interface_gate(
          '''
          new_validation = '''    output_dir = _fresh_directory(output_dir)
              assets = _sector_assets(Path(assets_dir).resolve())
              openmc.Materials.cross_sections = str(assets["cross_sections"])
              planar = run_planar_interface_gate(
          '''
          if validation_text.count(old_validation) != 1:
              raise SystemExit("cross-section patch anchor mismatch")
          validation_path.write_text(
              validation_text.replace(old_validation, new_validation),
              encoding="utf-8",
          )
          PY
          python -m pip install --disable-pip-version-check 'black==25.12.0'
          black tests/test_magnet_spectral_handoff.py parastell/magnet_handoff_validation.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_magnet_spectral_handoff.py parastell/magnet_handoff_validation.py
          git commit -m 'Fix OpenMC 0.15.3 validation compatibility'
          git push origin "HEAD:${GITHUB_REF_NAME}"
