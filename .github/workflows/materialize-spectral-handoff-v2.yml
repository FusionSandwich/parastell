name: Materialize spectral handoff branch v2

on:
  push:
    branches:
      - agent/reactor-magnet-spectral-handoff-20260811

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Materialize verified Git blobs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          blobs = {
              "parastell/spectral_handoff.py": "cfc774184f792237fb5bba5828f9e8465a1d46dd",
              "tests/test_spectral_handoff.py": "e977677114b69eee6a437bb3ea69a26adfbc7a7e",
              "examples/spectral_handoff_config.yaml": "bd2490e6fbe9871fe5f4fb2409f57543b573cb46",
              "README.md": "5af72c11bd2d3de6a8af69e496369565b6c17709",
              "pyproject.toml": "b32f3426b29b2f767777a75395f54425ed44e063",
          }
          token = os.environ["GH_TOKEN"]
          repository = os.environ["GH_REPOSITORY"]
          for path, sha in blobs.items():
              request = Request(
                  f"https://api.github.com/repos/{repository}/git/blobs/{sha}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urlopen(request) as response:
                  payload = json.load(response)
              content = base64.b64decode(payload["content"])
              destination = Path(path)
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(content)

          for workflow in (
              ".github/workflows/materialize-spectral-handoff.yml",
              ".github/workflows/materialize-spectral-handoff-v2.yml",
          ):
              Path(workflow).unlink(missing_ok=True)
          PY

      - name: Install targeted test dependencies
        run: python -m pip install --disable-pip-version-check numpy pyyaml pytest

      - name: Verify and commit isolated branch
        run: |
          python -m compileall -q parastell/spectral_handoff.py tests/test_spectral_handoff.py
          PYTHONPATH=. pytest -q tests/test_spectral_handoff.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add reactor-to-magnet spectral handoff tooling"
          git push origin "HEAD:${GITHUB_REF_NAME}"
