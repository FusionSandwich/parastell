name: Apply audited magnet handoff repair

on:
  workflow_dispatch:
  push:
    branches:
      - agent/reactor-magnet-spectral-handoff-20260811
    paths:
      - .github/workflows/materialize-magnet-handoff-fix.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reactor-magnet-spectral-handoff-20260811
          fetch-depth: 0
      - name: Apply, validate, and publish repair
        shell: bash
        env:
          EXPECTED_BASE: 25cbb91bca4decc8daffce84ada0751bc008a12a
        run: |
          set -euo pipefail
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git merge-base --is-ancestor "${EXPECTED_BASE}" HEAD
          cat .github/patch-chunks/part*.patch > /tmp/magnet-handoff-fix.patch
          git apply --check /tmp/magnet-handoff-fix.patch
          git apply /tmp/magnet-handoff-fix.patch
          python -m compileall -q parastell tests
          python -m pip install --disable-pip-version-check -q \
            "black==25.*" h5py numpy pytest
          black --line-length 79 \
            parastell/hts_multilayer.py \
            parastell/magnet_handoff_validation.py \
            tests/test_hts_multilayer.py
          pytest -q \
            tests/test_hts_multilayer.py \
            tests/test_hts_tally_columns.py
          rm -rf \
            .github/patch-chunks \
            .github/workflows/materialize-magnet-handoff-fix.yml
          git diff --check
          git config user.name "FusionSandwich"
          git config user.email "145234893+FusionSandwich@users.noreply.github.com"
          git add -A
          git commit -m "Fix direction-conditioned HTS replay and build environment"
          git push origin HEAD:agent/reactor-magnet-spectral-handoff-20260811
