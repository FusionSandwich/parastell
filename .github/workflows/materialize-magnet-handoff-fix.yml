name: Materialize audited magnet handoff repair

on:
  workflow_dispatch:
  push:
    branches:
      - agent/reactor-magnet-spectral-handoff-20260811
    paths:
      - .github/workflows/materialize-magnet-handoff-fix.yml

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reactor-magnet-spectral-handoff-20260811
          fetch-depth: 0
      - name: Apply and package repair
        shell: bash
        env:
          EXPECTED_BASE: 25cbb91bca4decc8daffce84ada0751bc008a12a
        run: |
          set -euo pipefail
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git merge-base --is-ancestor "${EXPECTED_BASE}" HEAD
          cat .github/patch-chunks/part*.patch > /tmp/magnet-handoff-fix.patch
          git apply --check /tmp/magnet-handoff-fix.patch
          git apply /tmp/magnet-handoff-fix.patch
          python -m compileall -q parastell tests
          git diff --check
          mkdir -p /tmp/materialized/.github/workflows /tmp/materialized/parastell /tmp/materialized/tests
          cp environment.yml /tmp/materialized/environment.yml
          cp .github/workflows/build.yml /tmp/materialized/.github/workflows/build.yml
          cp parastell/hts_multilayer.py /tmp/materialized/parastell/hts_multilayer.py
          cp parastell/magnet_handoff_validation.py /tmp/materialized/parastell/magnet_handoff_validation.py
          cp tests/test_hts_multilayer.py /tmp/materialized/tests/test_hts_multilayer.py
      - uses: actions/upload-artifact@v4
        with:
          name: magnet-handoff-repair-materialized
          path: /tmp/materialized
          if-no-files-found: error
          retention-days: 1
