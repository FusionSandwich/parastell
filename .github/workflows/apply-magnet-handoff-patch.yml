name: Apply magnet handoff validation patch

on:
  push:
    branches:
      - agent/reactor-magnet-spectral-handoff-20260811

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Retry source-only magnet handoff patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify, apply, format, and commit source changes
        shell: bash
        run: |
          set -euo pipefail
          cat .ci/magnet-handoff-patch.b64.* | base64 --decode > /tmp/magnet-handoff-patch.tar.gz
          echo 'ca0586ebae2641a7482d250faadb2e5ca786c827d435130204e192a7e98e14db  /tmp/magnet-handoff-patch.tar.gz' | sha256sum --check
          tar -xzf /tmp/magnet-handoff-patch.tar.gz
          python -m pip install --disable-pip-version-check 'black==25.12.0'
          black .
          # The default Actions token may not push workflow-file changes.
          # Discard both tracked edits and newly created workflow files. The
          # connected GitHub control plane installs final workflows afterward.
          git clean -fd .github/workflows
          git checkout HEAD -- .github/workflows
          rm -rf .ci
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Apply formatted reactor-to-HTS handoff implementation'
          git push origin "HEAD:${GITHUB_REF_NAME}"
