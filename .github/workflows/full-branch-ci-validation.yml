name: Full branch CI validation

on:
  workflow_dispatch:
  push:
    branches:
      - agent/reactor-magnet-spectral-handoff-20260811
    paths:
      - .github/workflows/full-branch-ci-validation.yml

permissions:
  contents: read

jobs:
  full-tests:
    name: Full ParaStell suite without licensed Cubit calls
    runs-on: ubuntu-latest
    container: ghcr.io/svalinn/parastell-ci
    steps:
      - uses: actions/checkout@v4
      - name: Populate environment and run tests
        shell: bash
        run: |
          set -euo pipefail
          . /opt/etc/bashrc
          pip install --no-deps .
          cd tests
          pytest -v .
