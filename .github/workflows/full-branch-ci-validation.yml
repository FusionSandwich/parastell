name: Open-source ParaStell regression suite

on:
  workflow_dispatch:
  push:
    branches:
      - reactor-magnet-spectral-handoff-20260811

permissions:
  contents: read

jobs:
  open-source-tests:
    name: Full suite without licensed Cubit calls
    runs-on: ubuntu-latest
    container: ghcr.io/svalinn/parastell-ci
    steps:
      - uses: actions/checkout@v4
      - name: Install branch and run the open-source suite
        shell: bash
        run: |
          set -euo pipefail
          . /opt/etc/bashrc
          unset PYTHONPATH
          pip install --no-deps .
          cd tests
          pytest -v .
