name: Diagnose working ParaStell PyMOAB environment

on:
  workflow_dispatch:
  push:
    branches:
      - agent/reactor-magnet-spectral-handoff-20260811
    paths:
      - .github/workflows/diagnose-pymoab-environment.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    container: ghcr.io/svalinn/parastell-ci
    steps:
      - uses: actions/checkout@v4
      - name: Report working MOAB and Python bindings
        shell: bash
        run: |
          set -euo pipefail
          . /opt/etc/bashrc
          python --version
          python - <<'PY'
          import pathlib
          import pymoab
          from pymoab import core

          print("pymoab_file=", pathlib.Path(pymoab.__file__).resolve())
          print("core_file=", pathlib.Path(core.__file__).resolve())
          print("core_instance=", core.Core())
          PY
          conda list --show-channel-urls | grep -Ei '(^|[[:space:]])(moab|pymoab|python)([[:space:]]|$)' || true
          conda list --explicit | grep -Ei '/(moab|pymoab|python)-' || true
          python - <<'PY'
          import importlib.metadata
          for name in ("moab", "pymoab"):
              try:
                  print(name, importlib.metadata.version(name))
              except importlib.metadata.PackageNotFoundError:
                  print(name, "no-dist-info")
          PY
