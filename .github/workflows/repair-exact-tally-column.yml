name: Repair exact OpenMC tally-column matching

on:
  push:
    branches:
      - agent/reactor-magnet-spectral-handoff-20260811
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reactor-magnet-spectral-handoff-20260811
          fetch-depth: 0
      - name: Apply regression fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          implementation = Path("parastell/hts_multilayer.py")
          text = implementation.read_text()
          old = '''    for candidate in candidates:
              candidate_key = "".join(
                  character.lower()
                  for character in candidate
                  if character.isalnum()
              )
              for name, key in normalised.items():
                  if key == candidate_key or candidate_key in key:
                      return name
          return None
          '''
          new = '''    candidate_keys = [
              "".join(
                  character.lower()
                  for character in candidate
                  if character.isalnum()
              )
              for candidate in candidates
          ]
          for candidate_key in candidate_keys:
              for name, key in normalised.items():
                  if key == candidate_key:
                      return name
          for candidate_key in candidate_keys:
              matches = [
                  name
                  for name, key in normalised.items()
                  if candidate_key in key
              ]
              if len(matches) == 1:
                  return matches[0]
          return None
          '''
          if old not in text:
              raise SystemExit("expected _find_column implementation not found")
          implementation.write_text(text.replace(old, new))

          tests = Path("tests/test_hts_multilayer.py")
          test_text = tests.read_text()
          marker = "def test_find_column_prefers_exact_surface_name"
          if marker not in test_text:
              test_text += '''


def test_find_column_prefers_exact_surface_name():
    table = {
        "musurface_high": np.asarray([1.0]),
        "surface": np.asarray([101]),
    }
    assert hts_multilayer._find_column(table, "surface") == "surface"


def test_find_column_refuses_ambiguous_substring():
    table = {
        "left_surface": np.asarray([101]),
        "right_surface": np.asarray([102]),
    }
    assert hts_multilayer._find_column(table, "surface") is None
'''
              tests.write_text(test_text)
          PY
          python -m compileall -q parastell tests
          git diff --check
      - name: Remove one-use repair workflow and publish fix
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/repair-exact-tally-column.yml
          git config user.name "FusionSandwich"
          git config user.email "145234893+FusionSandwich@users.noreply.github.com"
          git add parastell/hts_multilayer.py tests/test_hts_multilayer.py .github/workflows/repair-exact-tally-column.yml
          git commit -m "Fix exact tally-column resolution for surface IDs"
          git push origin HEAD:agent/reactor-magnet-spectral-handoff-20260811
