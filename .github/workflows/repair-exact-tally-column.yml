name: Repair exact OpenMC tally-column matching

on:
  push:
    branches:
      - agent/reactor-magnet-spectral-handoff-20260811
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reactor-magnet-spectral-handoff-20260811
          fetch-depth: 0
      - name: Apply regression fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYCODE'
          from pathlib import Path
          path = Path("parastell/hts_multilayer.py")
          text = path.read_text()
          old = "            if key == candidate_key or candidate_key in key:\n                return name"
          new = "            if key == candidate_key:\n                return name"
          if text.count(old) != 1:
              raise SystemExit(f"expected one matcher occurrence, found {text.count(old)}")
          path.write_text(text.replace(old, new))
          PYCODE
          python -m compileall -q parastell tests
          git diff --check
      - name: Remove one-use workflow and publish fix
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/repair-exact-tally-column.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add parastell/hts_multilayer.py .github/workflows/repair-exact-tally-column.yml
          git commit -m "Fix exact tally-column resolution for surface IDs"
          git push origin HEAD:agent/reactor-magnet-spectral-handoff-20260811
