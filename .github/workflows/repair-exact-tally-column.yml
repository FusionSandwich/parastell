name: Repair exact OpenMC tally-column matching

on:
  push:
    branches:
      - agent/reactor-magnet-spectral-handoff-20260811
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reactor-magnet-spectral-handoff-20260811
          fetch-depth: 0
      - name: Apply regression fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          implementation = Path("parastell/hts_multilayer.py")
          text = implementation.read_text()
          old = "            if key == candidate_key or candidate_key in key:\n                return name"
          new = "            if key == candidate_key:\n                return name"
          if text.count(old) != 1:
              raise SystemExit(f"expected one column-matcher occurrence, found {text.count(old)}")
          implementation.write_text(text.replace(old, new))

          tests = Path("tests/test_hts_multilayer.py")
          test_text = tests.read_text()
          marker = "def test_find_column_prefers_exact_surface_name"
          if marker not in test_text:
              test_text += '''


def test_find_column_prefers_exact_surface_name():
    from parastell.hts_multilayer import _find_column

    table = {
        "musurface_high": np.asarray([1.0]),
        "surface": np.asarray([101]),
    }
    assert _find_column(table, "surface") == "surface"
'''
              tests.write_text(test_text)
          PY
          python -m compileall -q parastell tests
          git diff --check
      - name: Remove one-use workflow and publish fix
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/repair-exact-tally-column.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add parastell/hts_multilayer.py tests/test_hts_multilayer.py .github/workflows/repair-exact-tally-column.yml
          git commit -m "Fix exact tally-column resolution for surface IDs"
          git push origin HEAD:agent/reactor-magnet-spectral-handoff-20260811
