name: Retire obsolete prefixed branch

on:
  push:
    branches:
      - reactor-magnet-spectral-handoff-20260811
    paths:
      - .github/workflows/retire-prefixed-branch.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reactor-magnet-spectral-handoff-20260811
          fetch-depth: 0
      - name: Delete obsolete branch and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete 'agent/reactor-magnet-spectral-handoff-20260811'
          rm .github/workflows/retire-prefixed-branch.yml
          git config user.name "FusionSandwich"
          git config user.email "145234893+FusionSandwich@users.noreply.github.com"
          git add -A
          git commit -m "Complete branch-name migration"
          git push origin HEAD:reactor-magnet-spectral-handoff-20260811
