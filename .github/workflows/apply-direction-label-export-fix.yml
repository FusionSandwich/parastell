name: Apply direction-label export fix

on:
  push:
    branches:
      - agent/reactor-magnet-spectral-handoff-20260811

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Retry direction-label export fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch exporter and regression test
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source_path = Path("parastell/magnet_spectral_handoff.py")
          source = source_path.read_text(encoding="utf-8")
          start = source.index("def _add_derived_columns(")
          end = source.index("\ndef _add_direction_labels(", start)
          block = source[start:end]
          call = (
              '    if role == "boundary_current":\n'
              "        _add_direction_labels(table, region)\n"
          )
          if block.count(call) != 1:
              raise SystemExit(
                  f"expected one existing direction-label call, found {block.count(call)}"
              )
          mean_anchor = '    mean_name = _find_column(table, "mean")\n'
          if block.count(mean_anchor) != 1:
              raise SystemExit("mean-column anchor mismatch")
          block = block.replace(mean_anchor, call + "\n" + mean_anchor, 1)
          first = block.find(call)
          second = block.find(call, first + len(call))
          third = block.find(call, second + len(call)) if second >= 0 else -1
          if first < 0 or second < 0 or third >= 0:
              raise SystemExit("unexpected direction-label call count after insertion")
          block = block[:second] + block[second + len(call) :]
          if block.count(call) != 1 or block.find(call) > block.find(mean_anchor):
              raise SystemExit("direction-label call was not moved before uncertainty logic")
          source_path.write_text(
              source[:start] + block + source[end:],
              encoding="utf-8",
          )

          test_path = Path("tests/test_magnet_spectral_handoff.py")
          tests = test_path.read_text(encoding="utf-8")
          old_import = (
              "from parastell.magnet_spectral_handoff import (\n"
              "    _compatible_mesh_filter_dataframe,\n"
              ")\n"
          )
          new_import = (
              "from parastell.magnet_spectral_handoff import (\n"
              "    _add_derived_columns,\n"
              "    _compatible_mesh_filter_dataframe,\n"
              ")\n"
          )
          if tests.count(old_import) != 1:
              raise SystemExit("test import anchor mismatch")
          tests = tests.replace(old_import, new_import, 1)
          anchor = (
              "def test_openmc_015_unstructured_mesh_dataframe_compatibility("
              "monkeypatch):\n"
          )
          regression = '''def test_boundary_direction_labels_do_not_require_uncertainty_column():
              handoff = MagnetSpectralHandoff.from_mapping(handoff_mapping())
              table = {
                  "mean": np.asarray([0.0, 1.0]),
                  "musurface_low": np.asarray([-1.0, 0.0]),
                  "musurface_high": np.asarray([0.0, 1.0]),
                  "surface": np.asarray([20, 20]),
              }

              _add_derived_columns(
                  table,
                  role="boundary_current",
                  region=handoff.region("coil A winding pack"),
                  source_rate_per_s=None,
                  tally=None,
                  row_count=2,
              )

              assert table["magnet_direction"].tolist() == [
                  "incoming",
                  "outgoing",
              ]


          '''
          if tests.count(anchor) != 1:
              raise SystemExit("test insertion anchor mismatch")
          test_path.write_text(
              tests.replace(anchor, regression + anchor, 1),
              encoding="utf-8",
          )
          PY
          python -m pip install --disable-pip-version-check 'black==25.12.0'
          black parastell/magnet_spectral_handoff.py tests/test_magnet_spectral_handoff.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add parastell/magnet_spectral_handoff.py tests/test_magnet_spectral_handoff.py
          git commit -m 'Export boundary directions without uncertainty columns'
          git push origin "HEAD:${GITHUB_REF_NAME}"
