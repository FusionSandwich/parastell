name: Snapshot magnet handoff branch

on:
  push:
    branches:
      - agent/reactor-magnet-spectral-handoff-20260811
    paths:
      - .github/workflows/snapshot-magnet-handoff.yml

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive branch
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git -czf /tmp/parastell-branch.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: parastell-branch-snapshot
          path: /tmp/parastell-branch.tar.gz
          if-no-files-found: error
          retention-days: 1
